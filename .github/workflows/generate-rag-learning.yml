name: Generate RAG learning PPTs

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_rag_ppts.js"
      - "pages/1_Learn_RAG.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PowerPoint generator
        run: npm install pptxgenjs

      - name: Generate RAG learning decks
        run: node scripts/generate_rag_ppts.js

      - name: Commit generated PPT files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/*.pptx
          if git diff --cached --quiet; then
            echo "No PPT changes to commit."
          else
            git commit -m "Generate RAG learning PPT modules"
            git push
          fi
