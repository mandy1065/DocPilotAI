name: Fix Streamlit chat avatars

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove unsupported chat avatars from app.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'with st.chat_message(m["role"], avatar=avatar):': 'with st.chat_message(m["role"]):',
              'with st.chat_message("user", avatar="🧑‍💻"):': 'with st.chat_message("user"):',
              'with st.chat_message("assistant", avatar="✦"):': 'with st.chat_message("assistant"):',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # The avatar assignment is no longer needed once all chat_message calls
          # use Streamlit's built-in default avatars.
          text = text.replace(
              '            avatar = "🧑‍💻" if m["role"] == "user" else "✦"\n',
              '',
          )

          if 'avatar=' in '\n'.join(
              line for line in text.splitlines() if 'st.chat_message' in line
          ):
              raise SystemExit("A custom st.chat_message avatar still remains")

          path.write_text(text, encoding="utf-8")

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit source fix if needed
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py is already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix Streamlit chat avatar compatibility"
          git push
